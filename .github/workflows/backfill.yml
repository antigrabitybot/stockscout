name: StockScout Backfill (one-time)

# 初回だけ手動実行する、5年分ヒストリカルの一括取得。
# 約970銘柄 × 数十分。ストア(price-store.json.gz)を Google Drive に作成する。
# これが完了してから、毎日の "StockScout Daily Update" が差分追記を始められる。
#
# 実行方法: GitHub の Actions タブ → このワークフロー → "Run workflow"
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 数十分かかる想定。上限を広めに取る
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 共有ロジックを StockScout.jsx から自動抽出
        run: node scripts/extract-logic.mjs

      - name: 5年分バックフィル(全銘柄 → Google Drive のストアへ保存)
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node batch/backfill.mjs
