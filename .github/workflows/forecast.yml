name: StockScout Forecast
on:
  workflow_run:
    workflows: [StockScout Daily Update]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: stockscout-forecast
  cancel-in-progress: false
jobs:
  forecast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: batch/requirements-forecast.txt
      - name: CPU推論環境を準備
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r batch/requirements-forecast.txt
      - name: 保存済みの日本株履歴を読み込む
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node batch/forecast-input.mjs
      - name: 予測変換を検証
        run: python -m unittest discover -s batch -p test_forecast.py
      - name: 日経平均と日本株の予測を生成
        run: python batch/forecast.py
      - name: 予測を公開
        run: |
          git config user.name 'stockscout-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/forecasts.json
          git diff --cached --quiet || git commit -m 'chore: update TimesFM forecasts'
          git pull --rebase origin main
          git push origin HEAD:main
